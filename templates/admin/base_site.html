{% extends "admin/base.html" %}

{% block title %}{{ title }} | MahiCodeX Admin{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="color: #12ff00; font-family: 'Lexend', sans-serif; font-weight: 800; text-shadow: 0 0 10px rgba(18,255,0,0.5);">
        MahiCodeX Control Panel
    </a>
</h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    /* Custom Dark Neon Theme for Django Admin Page */
    body {
        background: #0a0a0a !important;
        color: #ffffff !important;
        font-family: 'Inter', sans-serif !important;
    }
    
    #header {
        background: #141414 !important;
        border-bottom: 2px solid #12ff00 !important;
        padding: 15px 40px !important;
    }
    
    #branding h1 {
        color: #12ff00 !important;
    }
    
    a:link, a:visited {
        color: #12ff00 !important;
        transition: all 0.3s ease;
    }
    
    a:hover {
        color: #10e000 !important;
        text-shadow: 0 0 5px #12ff00;
    }
    
    .module {
        background: #141414 !important;
        border: 1px solid rgba(18, 255, 0, 0.15) !important;
        border-radius: 12px !important;
        overflow: hidden;
    }
    
    .module h2, .module caption {
        background: rgba(18, 255, 0, 0.08) !important;
        color: #12ff00 !important;
        font-family: 'Lexend', sans-serif !important;
        font-weight: 700 !important;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    div.breadcrumbs {
        background: #111 !important;
        color: #a0a0a0 !important;
        border-bottom: 1px solid rgba(255,255,255,0.05) !important;
        padding: 10px 40px !important;
    }
    
    div.breadcrumbs a {
        color: #a0a0a0 !important;
    }
    
    #content-main {
        margin-top: 20px !important;
        padding: 0 20px !important;
    }
    
    .app-user, .app-dashboard {
        margin-bottom: 30px !important;
    }
    
    /* Table Styles in Admin */
    table {
        width: 100% !important;
    }
    
    table thead th {
        background: #111 !important;
        border-bottom: 1px solid rgba(18, 255, 0, 0.15) !important;
        color: #12ff00 !important;
        font-family: 'Lexend', sans-serif !important;
        text-transform: uppercase;
        font-size: 0.8rem;
    }
    
    table tr.row1 {
        background: #141414 !important;
    }
    
    table tr.row2 {
        background: #181818 !important;
    }
    
    table tbody tr:hover {
        background: rgba(18, 255, 0, 0.05) !important;
    }
    
    td, th {
        border-bottom: 1px solid rgba(255,255,255,0.05) !important;
        color: #a0a0a0 !important;
    }
    
    /* Buttons in Admin */
    .button, input[type=submit], input[type=button], .submit-row a.deletelink {
        background: #12ff00 !important;
        color: #000000 !important;
        font-weight: 700 !important;
        border: none !important;
        border-radius: 6px !important;
        padding: 10px 20px !important;
        transition: all 0.3s ease !important;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.5px;
    }
    
    .button:hover, input[type=submit]:hover, input[type=button]:hover {
        box-shadow: 0 0 12px #12ff00 !important;
        transform: translateY(-1px);
        background: #10e000 !important;
    }
    
    .submit-row {
        background: #141414 !important;
        border: 1px solid rgba(255,255,255,0.05) !important;
        border-radius: 8px;
    }
    
    /* Sidebar style */
    #content-related {
        background: #141414 !important;
        border: 1px solid rgba(18, 255, 0, 0.15) !important;
        border-radius: 12px !important;
        padding: 20px !important;
        color: #a0a0a0 !important;
    }
    
    #content-related h3 {
        color: #12ff00 !important;
        font-family: 'Lexend', sans-serif;
    }
    
    .module h2 a {
        color: #12ff00 !important;
    }
</style>
{% endblock %}
