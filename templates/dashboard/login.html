{% extends 'base.html' %}

{% block title %}MahiCodeX - Dashboard Login{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="row justify-content-center w-100">
        <div class="col-md-5">
            <div class="card-dark p-5 shadow-lg border-0 fade-in animate">
                <div class="text-center mb-5">
                    <h2 class="text-green mb-2">Welcome Back</h2>
                    <p class="text-muted">Enter your credentials to manage your portfolio</p>
                </div>

                {% if form.errors %}
                    <div class="alert alert-danger border-0 mb-4" style="background: rgba(220, 53, 69, 0.1); color: #ff6b6b; padding: 15px; border-radius: 8px;">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Invalid username or password.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label for="id_username" class="form-label text-muted small text-uppercase fw-bold">Username</label>
                        <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter username" required autofocus>
                    </div>
                    <div class="mb-5">
                        <label for="id_password" class="form-label text-muted small text-uppercase fw-bold">Password</label>
                        <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn-primary-green w-100 mb-3">Login to Dashboard</button>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'user:index' %}" class="text-muted text-decoration-none small">
                        <i class="fas fa-arrow-left me-1"></i> Back to Portfolio
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Specific overrides for login page */
    body {
        background: #0a0a0a !important;
    }
    .card-dark {
        background: #111 !important;
        border: 1px solid rgba(18, 255, 0, 0.1) !important;
    }
</style>
{% endblock %}
